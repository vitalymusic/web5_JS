<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Document</title>

    <style>
        .photos{
          display: grid;
          grid-template-columns: 1fr 1fr 1fr 1fr;
          justify-content: center;
          gap:20px;    
            img{
              height: 100%;
            }
        }
    </style>
</head>
<body>

  <input type="text" name="" id="" placeholder="ievadi meklējamo vārdu">
  <button>Meklēt</button>


  <div class="photos"></div>

    

    <script>
        const key = "exaM4WddpeCHbumfoRf61GLq1qJnHUP110KINxjn3FdgitUTOX2xniiB";


// Izmantojot Pexels uztaisīt 
// 1. Formu, kurā var rakstīt atslēgas vārdus foto meklēšanai
//  2.Uzrakstīt bilžu izvadi kā GRID lai klikšķinot uz bildes var ieraudzīt tās autoru. 
// 3. Dialogs, kurā parādās uzklikšķināta bilde pilnā izmērā 



        $(document).ready(()=>{
            $('button').click(()=>{
              let search = $('input').val();
              let html;
              $.ajax({
                  url:`https://api.pexels.com/v1/search?query=${search}`,
                  method:"GET",
                  headers:{
                    Authorization:key
                  },
                  success:(data)=>{
                      console.log(data.photos);
                      $.each(data.photos,(i,image)=>{
                            html+=`<img src="${image.src.medium}" alt="${image.alt}" data-autors="${image.photographer}">` 
                      })
                      $('.photos').append(`html`);
                  }
              })


            })  



            // 





        })

    </script>
</body>
</html>
