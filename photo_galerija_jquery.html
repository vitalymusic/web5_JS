<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
    integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-modal/0.9.2/jquery.modal.min.js"
    integrity="sha512-ztxZscxb55lKL+xmWGZEbBHekIzy+1qYKHGZTWZYH1GUwxy0hiA18lW6ORIMj4DHRgvmP/qGcvqwEyFFV7OYVQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-modal/0.9.2/jquery.modal.css"
    integrity="sha512-JP49dvydjvdq6qd31grbdqIeExUyLFFIIneoetY/cJ+eQeJ6ok5HhaM4kQfIeQV4maAMGQ5kf4In3T7VKwMufg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />


  <!-- karuselis -->


  <script src="https://cdnjs.cloudflare.com/ajax/libs/jcarousel/0.3.9/jquery.jcarousel.min.js"
    integrity="sha512-5TU8T3STShZiLsdqDqiKnj0Z72ccPZpIDCuItxc2S7G3lyiwqiuLuDFVNsLQ7Hgu5f33DlZ2KAJspbn6NAXqnA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://sorgalla.com/jcarousel/examples/basic/jcarousel.basic.js">

  </script>

  <link rel="stylesheet" href="https://sorgalla.com/jcarousel/examples/basic/jcarousel.basic.css">



  <title>Document</title>

  <style>
    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      justify-content: center;
      align-items: center;
      gap: 20px;

      img {
        max-width: 100%;
        height: auto;
      }
    }


    .loader {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: inline-block;
      position: relative;
      border: 3px solid;
      border-color: #FFF #FFF transparent transparent;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }

    .loader::after,
    .loader::before {
      content: '';
      box-sizing: border-box;
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      margin: auto;
      border: 3px solid;
      border-color: transparent transparent #FF3D00 #FF3D00;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      box-sizing: border-box;
      animation: rotationBack 0.5s linear infinite;
      transform-origin: center center;
    }

    .loader::before {
      width: 32px;
      height: 32px;
      border-color: #FFF #FFF transparent transparent;
      animation: rotation 1.5s linear infinite;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes rotationBack {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(-360deg);
      }
    }




    /* Karuselis css */

    .jcarousel {
      position: relative;
      overflow: hidden;
    }

    .jcarousel div {
      width: 10000em;
      position: relative;

      /* Optional, required in this case since it's a <ul> element */
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* Pamatkonteiners */
    .search-form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 900px;
      margin: 40px auto;
    }

    /* Input un Select kopīgais stils */
    .search-form input,
    .search-form select {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      background: #f8fafc;
    }

    /* Input platums */
    .search-form input {
      flex: 1;
      min-width: 220px;
    }

    /* Select minimālais platums */
    .search-form select {
      min-width: 140px;
      cursor: pointer;
    }

    /* Focus efekts */
    .search-form input:focus,
    .search-form select:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Poga */
    .search-form button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    /* Hover efekts */
    .search-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }

    /* Active klikšķa efekts */
    .search-form button:active {
      transform: scale(0.97);
    }

    /* Mobilais skats */
    @media (max-width: 600px) {
      .search-form {
        flex-direction: column;
        align-items: stretch;
      }

      .search-form button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="search-form">
    <input type="text" name="" id="" placeholder="ievadi meklējamo vārdu">
    <select name="photo_type" id="">
      <option value="landscape">Horizontālās</option>
      <option value="portrait">Vertikālās</option>
      <option value="square">Kvadrāts</option>
    </select>
    <select name="quantity" id="">
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
      <option value="40">40</option>
      <option value="80">80</option>
    </select>
    <button>Meklēt</button>
  </div>


  <div class="photos"></div>


  <div class="modal">
    <img src="" alt="" style="max-width: 100%;">
    <h3 style="text-align: center"></h3>

  </div>

  <h3>Karuselis</h3>


  <div class="jcarousel-wrapper">
    <div class="jcarousel" data-jcarousel="true">
      <ul style="left: -1200px; top: 0px;">
        <li><img src="https://sorgalla.com/jcarousel/examples/_shared/img/img1.jpg" width="600" height="400" alt="">
        </li>
        <li><img src="https://sorgalla.com/jcarousel/examples/_shared/img/img1.jpg" width="600" height="400" alt="">
        </li>
        <li><img src="https://sorgalla.com/jcarousel/examples/_shared/img/img1.jpg" width="600" height="400" alt="">
        </li>
        <li><img src="https://sorgalla.com/jcarousel/examples/_shared/img/img1.jpg" width="600" height="400" alt="">
        </li>
      </ul>
    </div>

    <p class="photo-credits">
      Photos by <a href="http://www.mw-fotografie.de">Marc Wiegelmann</a>
    </p>

    <a href="#" class="jcarousel-control-prev" data-jcarouselcontrol="true">‹</a>
    <a href="#" class="jcarousel-control-next" data-jcarouselcontrol="true">›</a>

    <p class="jcarousel-pagination" data-jcarouselpagination="true"><a href="#1">1</a><a href="#2">2</a><a href="#3"
        class="active">3</a><a href="#4">4</a><a href="#5">5</a><a href="#6">6</a></p>
  </div>

  <script>
    const key = "exaM4WddpeCHbumfoRf61GLq1qJnHUP110KINxjn3FdgitUTOX2xniiB";


    // Izmantojot Pexels uztaisīt 
    // 1. Formu, kurā var rakstīt atslēgas vārdus foto meklēšanai
    //  2.Uzrakstīt bilžu izvadi kā GRID lai klikšķinot uz bildes var ieraudzīt tās autoru. 
    // 3. Dialogs, kurā parādās uzklikšķināta bilde pilnā izmērā 



    $(document).ready(() => {
      $('button').click(() => {
        let search = $('input').val();
        let quantity = $('select[name="quantity"]').val();
        let orientation = $('select[name="photo_type"]').val();
        let html = "";
        $.ajax({
          url: `https://api.pexels.com/v1/search?query=${search}&orientation=${orientation}&per_page=${quantity}`,
          method: "GET",
          headers: {
            Authorization: key
          },
          beforeSend: () => {
            $('.photos').html(`
                      <span class="loader"></span>
                    `);
          },
          success: (data) => {
            console.log(data.photos);
            $.each(data.photos, (i, image) => {
              html += `<img src="${image.src.medium}" alt="${image.alt}" data-autors="${image.photographer}">`
            })
            $('.photos').html(html);
          }

        })
          .done(() => {
            $('.photos img').click((e) => {
              console.log(e.target);
              $('.modal img').attr({
                src: $(e.target).attr("src"),
                alt: $(e.target).attr("alt")
              });
              $('.modal h3').text($(e.target).attr("data-autors"))
              $('.modal').modal({
                fadeDuration: 250
              });
            })
          })


      })



      // Karuselis inicializācija
      $('.jcarousel').jcarousel({
        // Configuration goes here
        list: 'ul',
        items: 'li',
        animation: 'slow',
        // vertical: true,
        center: true,
        wrap: 'both'
      });




    })

  </script>
</body>

</html>
